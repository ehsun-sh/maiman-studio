# Tell maimanstudio.com that the docs or the release may have changed.
#
# The site reads docs/ (through docs/nav.yml) and the version in pyproject.toml
# straight from this repository. On every push to main that touches either,
# this sends a repository_dispatch to ehsun-sh/maiman-studio-landing, whose
# sync-docs workflow rebuilds the pages and deploys them. The site also checks
# hourly on its own, so a missed dispatch only delays an update.
#
# Needs one secret, SITE_DISPATCH_TOKEN: a fine-grained personal access token
# with access to ehsun-sh/maiman-studio-landing only, and the repository
# permission "Contents: Read and write" (which is what repository_dispatch
# requires). Without the secret the job is skipped, not failed.
name: Notify site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pyproject.toml"
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to the site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site will pick this up on its hourly sync."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ehsun-sh/maiman-studio-landing/dispatches \
            -d "{\"event_type\":\"maiman-studio-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
